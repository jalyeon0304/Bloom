[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom"
version = "0.1.0"
description = "Webview 급전지시 이벤트 모니터링"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "playwright>=1.47.0",
  "apscheduler>=3.10.4",
  "openpyxl>=3.1.5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
bloom = ["stamp_capacity.tsv", "ui_dashboard.html", "ui_summary_preview.html", "ui_summary_main.html", "ui_site_detail.html", "ui_fixtures/*.json"]
