<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Detail</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--muted:#6b7280;--ok:#059669;--err:#dc2626}
    body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .wrap{max-width:1050px;margin:0 auto;padding:16px;display:grid;gap:12px}
    .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);border-radius:16px;padding:6px 10px;cursor:pointer;background:#fff}
    .readonly{color:var(--err);font-size:12px;font-weight:700}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
    #chart{width:100%;height:260px}.chart-wrap{position:relative}.tooltip{position:absolute;display:none;pointer-events:none;background:#111827;color:#fff;border-radius:8px;font-size:11px;line-height:1.3;padding:6px 8px;white-space:pre-line;transform:translate(8px,-110%)}
    .editable-cell input{width:100px;padding:4px 6px;border:1px solid #d1d5db;border-radius:6px}
    .status{min-width:74px;text-align:right;font-size:12px}.saving{color:#2563eb}.saved{color:var(--ok);font-weight:700}.failed{color:var(--err);font-weight:700}
    .logs{max-height:180px;overflow:auto;background:#f9fafb;border-radius:8px;padding:8px;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <div>
      <button class="btn" id="backBtn">← Back to Summary</button>
      <strong id="title">SITE</strong>
      <div class="muted" id="subtitle"></div>
    </div>
    <div>
      <label class="muted">Role <select id="roleSel"><option value="viewer">viewer</option><option value="operator">operator</option></select></label>
      <label class="muted">Name <input id="nameInput"/></label>
      <label class="muted">Date <input id="dateInput" type="date"/></label>
      <button class="btn" id="reloadBtn">Reload</button>
      <span id="ro" class="readonly">Viewer mode</span>
    </div>
  </div>

  <div class="card">
    <strong>KPI + History (2026~)</strong>
    <table><tbody id="kpi"></tbody></table>
  </div>

  <div class="card">
    <strong>Site Chart</strong>
    <div class="chart-wrap"><canvas id="chart" width="920" height="260"></canvas><div id="tooltip" class="tooltip"></div></div>
  </div>

  <div class="card">
    <strong>Schedule</strong>
    <table>
      <thead><tr><th>rmccStart</th><th>start</th><th>finish</th><th>minKw</th><th>maxKw</th><th>isCanceled</th><th></th></tr></thead>
      <tbody id="sched"></tbody>
    </table>
  </div>

  <div class="card">
    <strong>Site Timeline (snapshot events)</strong>
    <div id="timeline" class="logs"></div>
  </div>

  <div class="card">
    <strong>System Logs</strong>
    <div id="logs" class="logs"></div>
  </div>
</div>
<script>
const SITE_ID='__SITE_ID__';
let CURRENT=null;
const hover={points:[]};
const num=v=>Number(v||0).toLocaleString('en-US');
const role=()=>localStorage.getItem('uikit.role')||'viewer';
const isOp=()=>role()==='operator';
const hh=v=>{const m=String(v||'').match(/T(\d{2}):(\d{2})/)||String(v||'').match(/^(\d{2}):(\d{2})$/); return m?Number(m[1])*60+Number(m[2]):0};
const tl=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const headers=()=>{const h={'X-User-Role':role()}; const n=(localStorage.getItem('uikit.name')||'').trim(); if(n) h['X-User-Name']=n; return h;};

function yMax(site){ return Math.ceil((Number(site.capacityKw||10000))/10000)*10000; }
function status(el,t,c){ el.className=`status ${c||''}`; el.textContent=t; }
function valid(f,v,row){
  if(['rmccStart','start','finish'].includes(f)){
    const m=/^(\d{2}):(\d{2})$/.exec(String(v)); if(!m) return 'HH:mm';
    const mins=+m[1]*60 + +m[2]; if(mins<600||mins>1020) return '10:00~17:00';
    const sv=f==='start'?v:row.start, fv=f==='finish'?v:row.finish;
    if(sv&&fv&&hh(`2026-01-01T${sv}:00+09:00`)>hh(`2026-01-01T${fv}:00+09:00`)) return 'start<=finish';
  }
  if(['minKw','maxKw'].includes(f)&&v!==''&&Number.isNaN(Number(v))) return 'number';
  return null;
}

async function load(){
  const q=new URLSearchParams(location.search);
  const dateIn=document.getElementById('dateInput');
  if(!dateIn.value) dateIn.value=q.get('date')||localStorage.getItem('uikit.date')||'';

  const meta=await (await fetch('/api/meta',{headers:headers()})).json();
  if(!dateIn.value) dateIn.value=meta.serverDateKst;
  const date=dateIn.value;

  const summaryRes=await fetch(`/api/summary?date=${encodeURIComponent(date)}`,{headers:headers()});
  if(!summaryRes.ok){ alert(await summaryRes.text()); return; }
  const payload=await summaryRes.json();
  const site=(payload.sites||[]).find(s=>s.siteId===SITE_ID);
  if(!site){ alert('site not found'); return; }

  const histSummaryRes=await fetch(`/api/history/summary?siteId=${encodeURIComponent(SITE_ID)}&from=2026-01-01`,{headers:headers()});
  const historySummary=histSummaryRes.ok ? await histSummaryRes.json() : {createdCount:0,updatedCount:0,canceledCount:0};

  const historyRes=await fetch(`/api/history?siteId=${encodeURIComponent(SITE_ID)}&from=2026-01-01`,{headers:headers()});
  const history=(historyRes.ok ? await historyRes.json() : {items:[]}).items || [];

  CURRENT={date,payload,site,historySummary,history};
  render();
}

function render(){
  const {payload,site,date,historySummary,history}=CURRENT;
  document.getElementById('title').textContent=`${site.siteId} · ${site.siteName}`;
  document.getElementById('subtitle').textContent=`${site.group} · capacity ${num(site.capacityKw)} kW`;
  document.getElementById('ro').style.display=isOp()?'none':'inline';

  const points=(payload.timeseriesBySiteId?.[site.siteId]||[]);
  const last=points.length?points[points.length-1].kw:null;
  document.getElementById('kpi').innerHTML=`
    <tr><td>capacityKw</td><td>${num(site.capacityKw)}</td></tr>
    <tr><td>baselineKw1000</td><td>${site.baselineKw1000??site.baselineKw0900??'—'}</td></tr>
    <tr><td>latestKw</td><td>${last??'—'}</td></tr>
    <tr><td>createdCount (2026~)</td><td>${historySummary.createdCount||0}</td></tr>
    <tr><td>updatedCount (2026~)</td><td>${historySummary.updatedCount||0}</td></tr>
    <tr><td>canceledCount (2026~)</td><td>${historySummary.canceledCount||0}</td></tr>
  `;

  renderChart(points,site);
  renderSched(site,date);
  renderLogs(payload.systemLogs||[]);
  renderTimeline(history);
}

function renderChart(points,site){
  const c=document.getElementById('chart').getContext('2d');
  const w=920,h=260,p={l:52,r:12,t:10,b:30},pw=w-p.l-p.r,ph=h-p.t-p.b;
  const xs=600,xe=1020,ym=yMax(site),toX=m=>p.l+((m-xs)/(xe-xs))*pw,toY=v=>p.t+(1-(v/ym))*ph;
  c.clearRect(0,0,w,h);
  for(let m=xs;m<=xe;m+=10){ const x=toX(m),maj=m%60===0; c.strokeStyle=maj?'#e5e7eb':'#f1f5f9'; c.beginPath(); c.moveTo(x,p.t); c.lineTo(x,h-p.b); c.stroke(); if(maj){ c.fillStyle='#6b7280'; c.font='11px sans-serif'; c.fillText(tl(m),x-14,h-10);} }
  for(let y=0;y<=ym;y+=10000){ const py=toY(y); c.strokeStyle='#e5e7eb'; c.beginPath(); c.moveTo(p.l,py); c.lineTo(w-p.r,py); c.stroke(); c.fillStyle='#6b7280'; c.font='11px sans-serif'; c.fillText(String(y),4,py+3); }

  const s=(points||[]).map(p=>({...p,mins:hh(p.measured_at),kw:Number(p.kw||0)})).filter(p=>p.mins>=600&&p.mins<=1020);
  if(s.length<2){ hover.points=[]; return; }
  c.strokeStyle='#2563eb'; c.lineWidth=2; c.beginPath();
  const pts=[];
  s.forEach((p,i)=>{ const x=toX(p.mins),y=toY(p.kw); pts.push({x,y,mins:p.mins,kw:p.kw}); i?c.lineTo(x,y):c.moveTo(x,y); });
  c.stroke(); c.fillStyle='#2563eb'; pts.forEach(p=>{ c.beginPath(); c.arc(p.x,p.y,2.5,0,Math.PI*2); c.fill(); });
  hover.points=pts;
}

function bindHover(){
  const canvas=document.getElementById('chart'),tt=document.getElementById('tooltip');
  canvas.onmousemove=(e)=>{
    const pts=hover.points; if(!pts.length) return;
    const r=canvas.getBoundingClientRect(); const mx=((e.clientX-r.left)/r.width)*canvas.width;
    let i=0,d=Math.abs(pts[0].x-mx); for(let j=1;j<pts.length;j++){const nd=Math.abs(pts[j].x-mx); if(nd<d){d=nd;i=j;}}
    const p=pts[i]; const cap=Number(CURRENT.site.capacityKw||0); const pct=cap>0?` (${((p.kw/cap)*100).toFixed(1)}%)`:'';
    tt.textContent=`${tl(p.mins)}\n${CURRENT.site.siteId} · ${num(p.kw)} kW${pct}`;
    tt.style.display='block'; tt.style.left=`${(p.x/canvas.width)*r.width}px`; tt.style.top=`${(p.y/canvas.height)*r.height}px`;
  };
  canvas.onmouseleave=()=>{tt.style.display='none';};
}

async function patch(field,value){
  return fetch('/api/schedule',{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({date:CURRENT.date,siteId:SITE_ID,field,value})});
}

function renderSched(row,date){
  const roleOp=isOp();
  const body=document.getElementById('sched'); body.innerHTML='';
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td class='editable-cell'><input data-field='rmccStart' value='${row.rmccStart||''}' ${roleOp?'':'readonly'} /></td>
    <td class='editable-cell'><input data-field='start' value='${row.start||''}' ${roleOp?'':'readonly'} /></td>
    <td class='editable-cell'><input data-field='finish' value='${row.finish||''}' ${roleOp?'':'readonly'} /></td>
    <td class='editable-cell'><input data-field='minKw' value='${row.minKw??''}' ${roleOp?'':'readonly'} /></td>
    <td>${row.group==='semi'?`<input data-field='maxKw' value='${row.maxKw??''}' ${roleOp?'':'readonly'} />`:'—'}</td>
    <td><button data-field='isCanceled' ${roleOp?'':'disabled'}>${row.isCanceled?'Canceled':'Active'}</button></td>
    <td class='status'></td>
  `;
  const st=tr.querySelector('.status');
  tr.querySelectorAll('input[data-field]').forEach(inp=>inp.onkeydown=async(e)=>{
    if(e.key!=='Enter'||!roleOp) return;
    const f=inp.dataset.field, nv=inp.value.trim(), ov=row[f]??'';
    const er=valid(f,nv,row); if(er){ inp.classList.add('cell-err'); status(st,'Failed','failed'); return; }
    inp.classList.remove('cell-err'); if(String(ov)===String(nv)){ status(st,'',''); return; }
    status(st,'Saving…','saving');
    const r=await patch(f,nv); if(!r.ok){ status(st,'Failed','failed'); return; }
    const b=await r.json(); row[f]=nv; status(st,'Saved ✓','saved'); setTimeout(()=>status(st,'',''),1300);
    if(b.logLine){ (CURRENT.payload.systemLogs||(CURRENT.payload.systemLogs=[])).push(b.logLine); renderLogs(CURRENT.payload.systemLogs); }
    await refreshHistory();
  }));

  const btn=tr.querySelector('button');
  btn.onclick=async()=>{
    if(!roleOp) return;
    const next=!row.isCanceled;
    status(st,'Saving…','saving');
    const r=await patch('isCanceled',next); if(!r.ok){ status(st,'Failed','failed'); return; }
    const b=await r.json(); row.isCanceled=next; btn.textContent=next?'Canceled':'Active'; status(st,'Saved ✓','saved'); setTimeout(()=>status(st,'',''),1300);
    if(b.logLine){ (CURRENT.payload.systemLogs||(CURRENT.payload.systemLogs=[])).push(b.logLine); renderLogs(CURRENT.payload.systemLogs); }
    await refreshHistory();
  };

  body.appendChild(tr);
}

function renderLogs(lines){
  const box=document.getElementById('logs');
  const only=(lines||[]).filter(l=>String(l).includes(` ${SITE_ID} `)).slice().reverse();
  box.innerHTML=only.length?only.map(l=>`<div>${l}</div>`).join(''):'<div class="muted">No logs</div>';
}

function renderTimeline(items){
  const box=document.getElementById('timeline');
  box.innerHTML=(items||[]).length
    ? items.map(it=>`<div>[${it.occurredAt}] ${it.eventType} · ${it.date} · min:${it.minKw} max:${it.maxKw??'—'} cancel:${it.isCanceled}</div>`).join('')
    : '<div class="muted">No history (2026~)</div>';
}

async function refreshHistory(){
  const hs=await fetch(`/api/history/summary?siteId=${encodeURIComponent(SITE_ID)}&from=2026-01-01`,{headers:headers()});
  const hi=await fetch(`/api/history?siteId=${encodeURIComponent(SITE_ID)}&from=2026-01-01`,{headers:headers()});
  if(hs.ok) CURRENT.historySummary=await hs.json();
  if(hi.ok) CURRENT.history=(await hi.json()).items||[];
  render();
}

function init(){
  document.getElementById('roleSel').value=localStorage.getItem('uikit.role')||'viewer';
  document.getElementById('nameInput').value=localStorage.getItem('uikit.name')||'';
  document.getElementById('roleSel').onchange=()=>{ localStorage.setItem('uikit.role',document.getElementById('roleSel').value); if(CURRENT) render(); };
  document.getElementById('nameInput').onchange=()=>{ localStorage.setItem('uikit.name',document.getElementById('nameInput').value.trim()); };
  document.getElementById('dateInput').onchange=()=>{ localStorage.setItem('uikit.date',document.getElementById('dateInput').value); load(); };
  document.getElementById('reloadBtn').onclick=load;
  document.getElementById('backBtn').onclick=()=>{ const d=document.getElementById('dateInput').value||''; location.href=`/dashboard?date=${encodeURIComponent(d)}`; };
  bindHover();
  load();
}

init();
</script>
</body>
</html>
