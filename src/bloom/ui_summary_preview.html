<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summary UI Kit Preview</title>
  <style>
    :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --line-minor:#f1f5f9; --primary:#2563eb; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:12px; }
    .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.06); }
    .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); border-radius:16px; padding:6px 10px; cursor:pointer; background:#fff; }
    .btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .muted { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:1.2fr 1fr; gap:12px; }
    .chart-wrap { position:relative; }
    #chart { width:100%; height:240px; }
    .tooltip { position:absolute; display:none; pointer-events:none; background:#111827; color:#fff; border-radius:8px; font-size:11px; line-height:1.3; padding:6px 8px; white-space:pre-line; transform:translate(8px,-110%); }
    table { width:100%; border-collapse:collapse; }
    td { border-bottom:1px solid var(--line); padding:8px; }
    td:last-child { text-align:right; font-weight:700; }
    .state-box { text-align:center; padding:28px 8px; color:var(--muted); }
    @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <div>
      <strong>Summary UI Preview (/ui-kit)</strong>
      <div class="muted">PR2: canvas 축/툴팁/yMax 스펙 반영</div>
    </div>
    <div class="btns">
      <button class="btn" data-scenario="loading">loading</button>
      <button class="btn" data-scenario="empty">empty</button>
      <button class="btn" data-scenario="normal">normal</button>
      <button class="btn" data-scenario="activeHighCapacity">activeHighCapacity</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="top"><strong id="title">Summary 차트</strong><span id="subtitle" class="muted"></span></div>
      <div class="chart-wrap">
        <canvas id="chart" width="720" height="240"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <div id="stateBox" class="state-box" style="display:none"></div>
    </div>
    <div class="card">
      <strong>Summary 테이블</strong>
      <table><tbody id="tbody"></tbody></table>
      <p class="muted" id="note"></p>
    </div>
  </div>
</div>
<script>
const defaultScenario = '__SCENARIO__' || 'normal';
const hoverState = { idx: -1, points: [], rows: null, chartData: null };

function num(v){ return Number(v || 0).toLocaleString('ko-KR'); }

function getActiveSites(data){
  return (data.sites || []).filter(s => s.isActive === true && s.isCanceled === false);
}

function yMaxBySpec(data){
  const active = getActiveSites(data);
  if(active.length === 0) return 10000;
  const maxCap = Math.max(...active.map(s => Number(s.capacityKw || 0)));
  return Math.ceil(maxCap / 10000) * 10000;
}

function parseToKstMinutes(iso){
  const d = new Date(iso);
  return d.getHours() * 60 + d.getMinutes();
}

function timeLabel(mins){
  const h = String(Math.floor(mins/60)).padStart(2, '0');
  const m = String(mins%60).padStart(2, '0');
  return `${h}:${m}`;
}

function drawSeries(data){
  const canvas = document.getElementById('chart');
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const rows = { left: 52, right: 12, top: 10, bottom: 30 };
  const plotW = w - rows.left - rows.right;
  const plotH = h - rows.top - rows.bottom;
  const xStart = 9 * 60;
  const xEnd = 17 * 60;

  c.clearRect(0,0,w,h);

  const yMin = 0;
  const yMax = yMaxBySpec(data);

  const toX = mins => rows.left + ((mins - xStart) / (xEnd - xStart)) * plotW;
  const toY = kw => rows.top + (1 - ((kw - yMin) / (yMax - yMin))) * plotH;

  // minor 10min grid + major 1h grid/labels
  for(let m = xStart; m <= xEnd; m += 10){
    const x = toX(m);
    const major = (m % 60 === 0);
    c.strokeStyle = major ? '#e5e7eb' : '#f1f5f9';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(x, rows.top);
    c.lineTo(x, h - rows.bottom);
    c.stroke();
    if(major){
      c.fillStyle = '#6b7280';
      c.font = '11px sans-serif';
      c.fillText(timeLabel(m), x - 14, h - 10);
    }
  }

  // y ticks by 10000
  c.fillStyle = '#6b7280';
  c.font = '11px sans-serif';
  for(let y = yMin; y <= yMax; y += 10000){
    const py = toY(y);
    c.strokeStyle = '#e5e7eb';
    c.beginPath();
    c.moveTo(rows.left, py);
    c.lineTo(w - rows.right, py);
    c.stroke();
    c.fillText(String(y), 4, py + 3);
  }

  // axes
  c.strokeStyle = '#9ca3af';
  c.beginPath();
  c.moveTo(rows.left, rows.top);
  c.lineTo(rows.left, h - rows.bottom);
  c.lineTo(w - rows.right, h - rows.bottom);
  c.stroke();

  // series
  const points = [];
  const siteId = data?.summary?.siteId || '-';
  const capacityKw = Number(data?.summary?.capacityKw || 0);
  const series = (data.series || []).map(p => ({ ...p, mins: parseToKstMinutes(p.measured_at) }))
    .filter(p => p.mins >= xStart && p.mins <= xEnd)
    .sort((a,b)=>a.mins-b.mins);

  if(series.length < 2){
    hoverState.points = [];
    return;
  }

  c.strokeStyle = '#2563eb';
  c.lineWidth = 2;
  c.beginPath();
  series.forEach((p, i) => {
    const x = toX(p.mins);
    const y = toY(Number(p.kw || 0));
    points.push({ x, y, mins: p.mins, kw: Number(p.kw || 0), siteId, capacityKw });
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  });
  c.stroke();

  // markers
  c.fillStyle = '#2563eb';
  points.forEach(p => {
    c.beginPath();
    c.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    c.fill();
  });

  // hover feedback
  if(hoverState.idx >= 0 && hoverState.idx < points.length){
    const hp = points[hoverState.idx];
    c.strokeStyle = '#93c5fd';
    c.beginPath();
    c.moveTo(hp.x, rows.top);
    c.lineTo(hp.x, h - rows.bottom);
    c.stroke();

    c.fillStyle = '#1d4ed8';
    c.beginPath();
    c.arc(hp.x, hp.y, 4, 0, Math.PI*2);
    c.fill();
  }

  hoverState.points = points;
  hoverState.rows = rows;
  hoverState.chartData = { siteId, capacityKw };
}

async function loadScenario(scenario){
  const res = await fetch(`/api/ui-kit/summary?scenario=${encodeURIComponent(scenario)}`);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

function applyScenarioInUrl(scenario){
  const u = new URL(window.location.href);
  u.searchParams.set('scenario', scenario);
  history.replaceState({}, '', u.toString());
}

function renderStateOnly(text){
  document.getElementById('chart').style.display='none';
  document.getElementById('tooltip').style.display='none';
  const box=document.getElementById('stateBox');
  box.style.display='block';
  box.textContent=text;
}

function bindHover(){
  const canvas = document.getElementById('chart');
  const tt = document.getElementById('tooltip');

  canvas.onmousemove = (e) => {
    const points = hoverState.points;
    if(!points.length) return;
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * canvas.width;

    let bestIdx = 0;
    let bestDist = Math.abs(points[0].x - mx);
    for(let i=1;i<points.length;i++){
      const d = Math.abs(points[i].x - mx);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    }
    hoverState.idx = bestIdx;

    const p = points[bestIdx];
    const line1 = timeLabel(p.mins);
    const pct = p.capacityKw > 0 ? ` (${((p.kw / p.capacityKw) * 100).toFixed(1)}%)` : '';
    const line2 = `${p.siteId} · ${num(p.kw)} kW${pct}`;
    tt.textContent = `${line1}\n${line2}`;
    tt.style.display = 'block';
    tt.style.left = `${(p.x / canvas.width) * rect.width}px`;
    tt.style.top = `${(p.y / canvas.height) * rect.height}px`;

    drawSeries(window.__currentData || {});
  };

  canvas.onmouseleave = () => {
    hoverState.idx = -1;
    tt.style.display = 'none';
    drawSeries(window.__currentData || {});
  };
}

function renderData(data){
  window.__currentData = data;
  const scenario = data.scenario || 'normal';
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active', b.dataset.scenario===scenario));
  applyScenarioInUrl(scenario);

  const summary = data.summary || {};
  document.getElementById('title').textContent = `${summary.siteId || '-'} Summary 차트`;
  document.getElementById('subtitle').textContent = `${summary.group || '-'} · capacity ${num(summary.capacityKw)} kW`;
  document.getElementById('note').textContent = summary.note || '';

  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  for(const row of (data.table || [])){
    const tr=document.createElement('tr');
    tr.innerHTML = `<td>${row.label}</td><td>${row.value}</td>`;
    tbody.appendChild(tr);
  }

  if(scenario==='loading') return renderStateOnly('로딩 중...');
  if(scenario==='empty') return renderStateOnly('표시할 데이터가 없습니다.');
  if(getActiveSites(data).length === 0) return renderStateOnly('활성 현장이 없습니다. (yMax=10000 fallback)');

  document.getElementById('stateBox').style.display='none';
  document.getElementById('chart').style.display='block';
  drawSeries(data);
}

async function boot(){
  const fromUrl = new URL(window.location.href).searchParams.get('scenario');
  const scenario = fromUrl || defaultScenario || 'normal';
  const data = await loadScenario(scenario);
  renderData(data);
}

document.querySelectorAll('.btn').forEach(btn=>{
  btn.onclick = async ()=>{ renderData(await loadScenario(btn.dataset.scenario)); };
});

bindHover();
boot();
</script>
</body>
</html>
