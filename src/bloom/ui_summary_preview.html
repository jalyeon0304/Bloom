<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summary UI Kit Preview</title>
  <style>
    :root { --bg:#f3f4f6; --text:#111827; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --primary:#2563eb; --ok:#059669; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:12px; }
    .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.06); }
    .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .toggles { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); border-radius:16px; padding:6px 10px; background:#fff; cursor:pointer; }
    .btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .muted { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:1.25fr 1fr; gap:12px; }
    .filters { display:grid; gap:8px; }
    .filter-group { border:1px solid var(--line); border-radius:10px; padding:8px; }
    .site-checks { display:grid; grid-template-columns:repeat(2,minmax(120px,1fr)); gap:6px; margin-top:6px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { border-bottom:1px solid var(--line); padding:8px; }
    td:last-child { text-align:right; }
    .editable { border:1px solid transparent; border-radius:6px; padding:4px 6px; width:120px; text-align:right; }
    .editable:focus { border-color:var(--primary); outline:none; }
    .saved { color:var(--ok); font-weight:700; min-width:72px; text-align:right; }
    .highlight { background:#ecfeff; transition: background .9s ease; }
    .logbox { max-height:140px; overflow:auto; font-size:12px; background:#f9fafb; padding:8px; border-radius:8px; }
    #summaryChart { width:100%; height:230px; }
    .chart-wrap { position:relative; }
    .tooltip { position:absolute; display:none; pointer-events:none; background:#111827; color:#fff; border-radius:8px; font-size:11px; padding:6px 8px; white-space:pre-line; transform:translate(8px,-110%); }
    .empty,.loading { text-align:center; padding:32px 12px; color:var(--muted); }
    @media (max-width:980px){ .grid{ grid-template-columns:1fr; } .site-checks{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <div>
      <strong>Summary UI Kit Preview</strong>
      <div class="muted">/ui-kit 또는 /dashboard?mock=1</div>
    </div>
    <div class="toggles">
      <button class="btn active" data-state="normal">normal</button>
      <button class="btn" data-state="loading">loading</button>
      <button class="btn" data-state="empty">empty</button>
      <button class="btn" data-state="high-capacity-active">high-capacity-active</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="top"><strong id="title">Summary 차트</strong><span id="subtitle" class="muted"></span></div>
      <div class="chart-wrap">
        <canvas id="summaryChart" width="760" height="230"></canvas>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <div id="hint" class="muted"></div>
    </div>

    <div class="card">
      <strong>필터 + 노트</strong>
      <div class="filters" id="filters"></div>
      <p class="muted" id="note"></p>
    </div>
  </div>

  <div class="card">
    <div class="top"><strong>스케줄 테이블 (mock inline edit)</strong><span class="muted">Enter = autosave / cancel = 당일 스케줄 취소</span></div>
    <table>
      <thead><tr><th>siteId</th><th>field</th><th>value</th><th>status</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div style="margin-top:8px;"><strong class="muted">Logs</strong><div class="logbox" id="logs"></div></div>
  </div>
</div>

<script>
const FIXTURE = __FIXTURE_JSON__;
const state = {
  mode: 'normal',
  checks: {},
  groups: { '준중앙': true, '비중앙': true },
  rows: [
    {site_id:'SKK167', field:'target_kw', value:'12000', status:'active'},
    {site_id:'SKK046', field:'min_power_kw', value:'10200', status:'active'},
    {site_id:'KMP000', field:'target_kw', value:'2400', status:'cancel'}
  ],
  logs: [],
  points: []
};

function allSites(){
  return [
    {site_id:'SKK046', group:'준중앙', capacity_kw:19800, active:true},
    {site_id:'SKK056', group:'준중앙', capacity_kw:8910, active:true},
    {site_id:'SKK167', group:'준중앙', capacity_kw:39600, active:true},
    {site_id:'KMP000', group:'비중앙', capacity_kw:6000, active:false},
    {site_id:'SKK000', group:'비중앙', capacity_kw:19800, active:true}
  ];
}

function initChecks(){
  for(const s of allSites()) state.checks[s.site_id] = true;
}

function selectedSites(){
  const sites = allSites();
  return sites.filter(s=>{
    const groupOn = !!state.groups[s.group];
    const siteOn = !!state.checks[s.site_id];
    return groupOn || siteOn; // 합집합
  });
}

function updateTriState(){
  ['준중앙','비중앙'].forEach(group=>{
    const ids = allSites().filter(s=>s.group===group).map(s=>s.site_id);
    const checked = ids.filter(id=>state.checks[id]).length;
    const cb = document.querySelector(`input[data-group="${group}"]`);
    cb.indeterminate = checked>0 && checked<ids.length;
    cb.checked = checked===ids.length;
  });
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML='';
  for(const group of ['준중앙','비중앙']){
    const box = document.createElement('div');
    box.className='filter-group';
    const sites = allSites().filter(s=>s.group===group);
    box.innerHTML = `<label><input type="checkbox" data-group="${group}" ${state.groups[group]?'checked':''}/> ${group} 전체</label><div class="site-checks" id="sites-${group}"></div>`;
    wrap.appendChild(box);
    const inner = box.querySelector(`#sites-${group}`);
    sites.forEach(s=>{
      const line = document.createElement('label');
      line.innerHTML = `<input type="checkbox" data-site="${s.site_id}" ${state.checks[s.site_id]?'checked':''}/> ${s.site_id}`;
      inner.appendChild(line);
    });
  }

  document.querySelectorAll('input[data-group]').forEach(cb=>cb.onchange=(e)=>{
    const g=e.target.dataset.group; state.groups[g]=e.target.checked;
    allSites().filter(s=>s.group===g).forEach(s=>state.checks[s.site_id]=e.target.checked);
    renderAll();
  });
  document.querySelectorAll('input[data-site]').forEach(cb=>cb.onchange=(e)=>{
    state.checks[e.target.dataset.site]=e.target.checked; renderAll();
  });
  updateTriState();
}

function yMaxFromSelection(){
  const maxCap = selectedSites().reduce((m,s)=>Math.max(m,s.capacity_kw),0);
  if(maxCap<=0) return 10000;
  return Math.ceil(maxCap/10000)*10000;
}

function drawChart(series, siteId){
  const canvas = document.getElementById('summaryChart');
  const c = canvas.getContext('2d'); const w=canvas.width,h=canvas.height;
  const tt = document.getElementById('tooltip');
  c.clearRect(0,0,w,h);
  if(series.length===0){ state.points=[]; return; }

  const left=52,right=14,top=10,bottom=30,pw=w-left-right,ph=h-top-bottom;
  const xStart=9*60, xEnd=17*60;
  const yMin=0, yMax=yMaxFromSelection();
  const toX = mins => left + ((mins-xStart)/(xEnd-xStart))*pw;
  const toY = kw => top + (1-(kw-yMin)/(yMax-yMin))*ph;

  c.font='11px sans-serif'; c.fillStyle='#6b7280'; c.strokeStyle='#e5e7eb';
  for(let y=0; y<=yMax; y+=10000){ const py=toY(y); c.beginPath(); c.moveTo(left,py); c.lineTo(w-right,py); c.stroke(); c.fillText(String(y),4,py+3); }

  for(let m=xStart; m<=xEnd; m+=10){
    const x=toX(m); const major=(m%60===0);
    c.strokeStyle = major ? '#e5e7eb' : '#f3f4f6';
    c.beginPath(); c.moveTo(x,top); c.lineTo(x,h-bottom); c.stroke();
    if(major){ c.fillStyle='#6b7280'; c.fillText(`${String(Math.floor(m/60)).padStart(2,'0')}:00`, x-14, h-8); }
  }

  c.strokeStyle='#9ca3af'; c.beginPath(); c.moveTo(left,top); c.lineTo(left,h-bottom); c.lineTo(w-right,h-bottom); c.stroke();
  c.strokeStyle='#2563eb'; c.lineWidth=2; c.beginPath();

  const points=[];
  series.forEach((p,i)=>{
    const d=new Date(p.measured_at); const mins=d.getHours()*60+d.getMinutes();
    if(mins<xStart || mins>xEnd) return;
    const x=toX(mins), y=toY(p.kw);
    points.push({x,y,siteId,kw:p.kw,time:d});
    if(i===0 || points.length===1) c.moveTo(x,y); else c.lineTo(x,y);
  });
  c.stroke(); c.lineWidth=1;
  state.points=points;

  canvas.onmousemove=(e)=>{
    if(!points.length){ tt.style.display='none'; return; }
    const rect=canvas.getBoundingClientRect();
    const mx=((e.clientX-rect.left)/rect.width)*canvas.width;
    let near=points[0];
    for(const p of points){ if(Math.abs(p.x-mx)<Math.abs(near.x-mx)) near=p; }
    const hh=String(near.time.getHours()).padStart(2,'0'); const mm=String(near.time.getMinutes()).padStart(2,'0');
    const cap = selectedSites().find(s=>s.site_id===near.siteId)?.capacity_kw || 0;
    const pct = cap>0 ? ` (${((near.kw/cap)*100).toFixed(1)}%)` : '';
    tt.textContent = `${hh}:${mm}\n${near.siteId} · ${near.kw.toLocaleString('ko-KR')} kW${pct}`;
    tt.style.display='block';
    tt.style.left=`${(near.x/canvas.width)*rect.width}px`;
    tt.style.top=`${(near.y/canvas.height)*rect.height}px`;
  };
  canvas.onmouseleave=()=>{ tt.style.display='none'; };
}

function logLine(siteId, field, oldV, newV, user='mock-user'){
  const d=new Date(); const hh=String(d.getHours()).padStart(2,'0'); const mm=String(d.getMinutes()).padStart(2,'0'); const ss=String(d.getSeconds()).padStart(2,'0');
  return `[${hh}:${mm}:${ss}] ${siteId} ${field} : ${oldV} → ${newV} (user:${user})`;
}

function renderTable(){
  const tbody=document.getElementById('tbody'); tbody.innerHTML='';
  state.rows.forEach((r,idx)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.site_id}</td><td>${r.field}</td><td><input class="editable" value="${r.value}"/></td><td>${r.status}</td><td class="saved" id="saved-${idx}"></td>`;
    const input = tr.querySelector('input');
    const old = r.value;
    input.onkeydown=(e)=>{
      if(e.key==='Enter'){
        const next=input.value.trim();
        state.rows[idx].value=next;
        input.classList.add('highlight');
        const saved=document.getElementById(`saved-${idx}`);
        saved.textContent='Saved ✓';
        setTimeout(()=>{ saved.textContent=''; input.classList.remove('highlight'); },1300);
        state.logs.unshift(logLine(r.site_id, r.field, old, next));
        renderLogs();
      }
    };
    tbody.appendChild(tr);
  });
}

function renderLogs(){ document.getElementById('logs').innerHTML = state.logs.map(l=>`<div>${l}</div>`).join('') || '<div class="muted">로그 없음</div>'; }

function buildSeries(mode){
  const base = FIXTURE.series;
  if(mode==='high-capacity-active') return base.map((p,i)=>({...p, kw:34000 + i*180}));
  return base;
}

function renderMode(){
  const title=document.getElementById('title'); const subtitle=document.getElementById('subtitle'); const note=document.getElementById('note');
  const hint=document.getElementById('hint'); const canvas=document.getElementById('summaryChart');
  hint.textContent=''; canvas.style.display='block';

  if(state.mode==='loading'){ title.textContent='Summary 차트 (loading)'; canvas.style.display='none'; hint.innerHTML='<div class="loading">로딩 중...</div>'; return; }
  if(state.mode==='empty'){ title.textContent='Summary 차트 (empty)'; canvas.style.display='none'; hint.innerHTML='<div class="empty">표시할 데이터가 없습니다.</div>'; return; }

  const selected = selectedSites();
  const lead = selected[0] || {site_id:FIXTURE.summary.site_id, group:FIXTURE.summary.group_type, capacity_kw:FIXTURE.summary.nameplate_kw};
  title.textContent = `${lead.site_id} Summary 차트`;
  subtitle.textContent = `${lead.group} · active ${lead.capacity_kw.toLocaleString('ko-KR')} kW`;
  note.textContent = `${FIXTURE.summary.note} / ${FIXTURE.summary.warning}`;
  drawChart(buildSeries(state.mode), lead.site_id);
}

function renderAll(){
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active', b.dataset.state===state.mode));
  renderFilters(); renderMode(); renderTable(); renderLogs();
}

initChecks();
document.querySelectorAll('.btn').forEach(btn=>btn.onclick=()=>{ state.mode=btn.dataset.state; renderAll(); });
renderAll();
</script>
</body>
</html>
